[project]
name = "forge"
version = "0.1.0"
description = "Python SDK for the Forge post-training control plane."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]

