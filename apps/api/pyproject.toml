[project]
name = "forge-api"
version = "0.1.0"
description = "Python customer API for the Forge post-training control plane."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "modal==1.5.2",
]

[project.optional-dependencies]
supabase = ["supabase>=2.10"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
