services:
  - type: web
    name: forge-tinkering-mvp
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: MODAL_APP_NAME
        value: forge-mvp
      - key: MODAL_ENVIRONMENT
        value: main
      - key: BASETEN_API_KEY
        sync: false
      - key: BASETEN_BASE_URL
        value: https://inference.baseten.co/v1
      - key: INTERNAL_API_KEY
        generateValue: true
